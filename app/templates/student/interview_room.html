{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/interview.css') }}">

<div class="interview-room" id="interview-room">
    <!-- Camera Feed (top-right) -->
    <div id="camera-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div id="camera-status">🔴 REC</div>
    </div>

    <!-- Main Content -->
    <div class="interview-content">
        <div class="interview-header">
            <div class="interview-title">{{ session.type|title }} Interview</div>
            <div class="interview-progress">
                <span id="question-counter">1</span> / <span id="total-questions">{{ session.total_questions }}</span>
            </div>
        </div>

        <!-- Question -->
        <div class="question-container">
            <div class="question-badge" id="question-badge">Question 1</div>
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="question-actions">
                <button id="listen-btn" onclick="speakQuestion()" class="btn-outline">🔊 Listen</button>
            </div>
        </div>

        <!-- Answer -->
        <div class="answer-container">
            <textarea id="answer-input" placeholder="Type your answer here..." maxlength="2000"></textarea>
            <div class="answer-actions">
                <button id="voice-btn" onclick="startVoiceInput()" class="btn-outline">🎤 Speak Answer</button>
                <button id="submit-btn" onclick="submitAnswer()" class="btn-ink">📤 Submit Answer</button>
            </div>
        </div>

        <!-- Feedback -->
        <div class="feedback-container" id="feedback-container" style="display:none;">
            <div class="feedback-header">📊 AI Feedback</div>
            <div id="feedback-content"></div>
        </div>

        <!-- Exit -->
        <div class="interview-footer">
            <button onclick="exitInterview()" class="btn-coral">🚫 Exit Interview</button>
        </div>
    </div>
</div>

<style>
.interview-room {
    display: flex;
    min-height: 100vh;
    background: var(--paper-2);
    position: relative;
}
#camera-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 200px;
    height: 150px;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid var(--green);
    z-index: 1000;
    background: #000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
#camera-feed { width: 100%; height: 100%; object-fit: cover; }
#camera-status {
    position: absolute; bottom: 4px; left: 4px;
    color: #ff4d4d; font-size: 10px; font-weight: 700;
    background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px;
}
.interview-content { flex: 1; padding: 40px 60px; display: flex; flex-direction: column; }
.interview-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
}
.interview-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.interview-progress { font-size: 15px; font-weight: 600; color: var(--amber-dark); }
.question-container {
    flex: 1; background: var(--card); border-radius: 16px; padding: 40px;
    border: 1px solid var(--line); margin-bottom: 20px;
}
.question-badge {
    font-size: 12px; font-weight: 600; color: var(--amber-dark);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px;
}
.question-text { font-size: 20px; line-height: 1.6; color: var(--ink); }
.question-actions { margin-top: 20px; }
.answer-container { margin-bottom: 20px; }
#answer-input {
    width: 100%; min-height: 120px; padding: 16px;
    border: 1.5px solid var(--line); border-radius: 12px;
    font-size: 15px; font-family: var(--font-body); resize: vertical;
}
#answer-input:focus { border-color: var(--amber); outline: none; }
.answer-actions { display: flex; gap: 12px; margin-top: 12px; }
.feedback-container {
    background: var(--green-light); border-radius: 12px; padding: 20px;
    margin-bottom: 20px; border-left: 4px solid var(--green);
}
.feedback-header { font-weight: 600; font-size: 16px; margin-bottom: 10px; }
.btn-coral {
    background: var(--coral); color: #fff; padding: 10px 20px;
    border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
}
.btn-coral:hover { background: var(--coral-dark); }
@media (max-width: 768px) {
    .interview-content { padding: 20px; }
    #camera-container { width: 120px; height: 90px; }
    .question-text { font-size: 16px; }
}
</style>

<script>
const state = {
    sessionId: {{ session.id }},
    totalQuestions: {{ session.total_questions }},
    currentIndex: 0,
    isAnswered: false,
    isProctoringActive: true
};

let cameraStream = null;

// ============================================================
// PROCTORING
// ============================================================
function initProctoring() {
    // Full-screen
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    // Camera
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
            cameraStream = stream;
            document.getElementById('camera-feed').srcObject = stream;
        })
        .catch(err => {
            alert('Camera access required. Please allow camera and try again.');
            window.location.href = '/student/interview';
        });

    // Exit full-screen detection
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && state.isProctoringActive) {
            cancelProctoring('Full-screen exited. Interview cancelled.');
        }
    });

    // Tab switch detection
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && state.isProctoringActive) {
            cancelProctoring('Tab switched. Interview cancelled.');
        }
    });

    // Window blur (background apps)
    window.addEventListener('blur', () => {
        if (state.isProctoringActive) {
            cancelProctoring('Application switched. Interview cancelled.');
        }
    });

    // Disable copy/paste
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x'].includes(e.key.toLowerCase())) {
            e.preventDefault();
            alert('Copy/paste is disabled during the interview.');
        }
    });
}

function cancelProctoring(reason) {
    state.isProctoringActive = false;
    alert('⚠️ ' + reason);
    fetch(`/student/interview/cancel/${state.sessionId}`)
        .finally(() => window.location.href = '/student/interview');
}

function exitInterview() {
    if (confirm('Exit interview? Progress will not be saved.')) {
        state.isProctoringActive = false;
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        if (document.fullscreenElement) document.exitFullscreen();
        window.location.href = '/student/interview';
    }
}

// ============================================================
// VOICE
// ============================================================
function speakQuestion() {
    const text = document.getElementById('question-text').textContent;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.9;
    utterance.lang = 'en-US';
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
}

function startVoiceInput() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition not supported.'); return; }

    const recognition = new SR();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        const btn = document.getElementById('voice-btn');
        btn.textContent = '🎤 Listening...';
        btn.style.background = 'var(--coral)';
        btn.style.color = '#fff';
    };

    recognition.onresult = (event) => {
        document.getElementById('answer-input').value = event.results[0][0].transcript;
        resetVoiceBtn();
    };

    recognition.onerror = resetVoiceBtn;
    recognition.onend = resetVoiceBtn;
    recognition.start();
}

function resetVoiceBtn() {
    const btn = document.getElementById('voice-btn');
    btn.textContent = '🎤 Speak Answer';
    btn.style.background = '';
    btn.style.color = '';
}

// ============================================================
// INTERVIEW FLOW
// ============================================================
function loadQuestion(index) {
    fetch(`/student/interview/question/${state.sessionId}/${index}`)
        .then(res => res.json())
        .then(data => {
            if (data.error) { alert(data.error); return; }
            document.getElementById('question-text').textContent = data.question;
            document.getElementById('question-counter').textContent = index + 1;
            document.getElementById('question-badge').textContent = `Question ${index + 1}`;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback-container').style.display = 'none';
            document.getElementById('submit-btn').textContent = '📤 Submit Answer';
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').onclick = submitAnswer;
            state.currentIndex = index;
            state.isAnswered = false;
            setTimeout(speakQuestion, 800);
        });
}

function submitAnswer() {
    const answer = document.getElementById('answer-input').value.trim();
    if (!answer) { alert('Please provide an answer.'); return; }
    if (state.isAnswered) { alert('Already answered.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.textContent = '⏳ Analyzing...';
    btn.disabled = true;

    fetch('/student/interview/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            session_id: state.sessionId,
            question_index: state.currentIndex,
            answer: answer
        })
    })
    .then(res => res.json())
    .then(data => {
        state.isAnswered = true;
        btn.disabled = false;

        const scoreColor = data.score >= 7 ? 'var(--green)' : data.score >= 5 ? 'var(--amber)' : 'var(--coral)';

        const fb = document.getElementById('feedback-container');
        fb.style.display = 'block';
        fb.innerHTML = `
            <div class="feedback-header">📊 AI Feedback</div>
            <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:10px;">
                <div><strong>Score:</strong> <span style="font-size:22px;font-weight:700;color:${scoreColor}">${data.score}/10</span></div>
                <div><strong>Clarity:</strong> ${data.clarity}/10</div>
                <div><strong>Correctness:</strong> ${data.correctness}/10</div>
                <div><strong>Completeness:</strong> ${data.completeness}/10</div>
                <div><strong>Communication:</strong> ${data.communication}/10</div>
            </div>
            <div style="padding:12px;background:var(--paper-2);border-radius:8px;">
                <strong>Feedback:</strong> ${data.feedback}
            </div>
        `;

        if (state.currentIndex + 1 >= state.totalQuestions) {
            btn.textContent = '🎉 Complete Interview';
            btn.onclick = completeInterview;
        } else {
            btn.textContent = '➡️ Next Question';
            btn.onclick = nextQuestion;
        }
    })
    .catch(err => {
        alert('Error submitting answer.');
        btn.textContent = '📤 Submit Answer';
        btn.disabled = false;
    });
}

function nextQuestion() {
    if (state.currentIndex + 1 < state.totalQuestions) {
        loadQuestion(state.currentIndex + 1);
    }
}

function completeInterview() {
    if (confirm('Submit your interview?')) {
        window.location.href = `/student/interview/complete/${state.sessionId}`;
    }
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    initProctoring();
    loadQuestion(0);
});
</script>
{% endblock %}
